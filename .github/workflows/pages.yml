name: Publish MooSic
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moosic-pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 20
    env:
      CI: 'true'
      MM_BROWSERS: chromium
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Type, architecture and unit checks
        run: |
          npm run typecheck
          npm run lint
          npm run check:architecture
          npm run test:unit
      - name: Library, encrypted sync, backup and history regressions
        run: npm run test:browser -- tests/backup.spec.ts tests/history.spec.ts tests/sync.spec.ts tests/sync-install.spec.ts tests/starter-catalog.spec.ts
      - name: Real offline and two-version update checks
        run: npm run test:browser -- --config playwright.pwa.config.ts
      - name: Build for the repository URL
        env:
          MM_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm run build
          npm run check:bundle
          npm run check:offline
      - name: Upload the application only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: publication-check-failures
          path: |
            playwright-report/
            test-results/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
